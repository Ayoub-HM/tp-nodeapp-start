name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: mkdir -p reports && npm test -- --run --reporter=default --reporter=junit --outputFile=reports/junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - codeql
      - lint
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_ENVIRONMENT_NAME: staging
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/
          retention-days: 7

  deploy-staging:
    name: Deploy to Netlify staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      deployment_status: ${{ steps.deploy_netlify.outputs.deployment_status || steps.explain_skipped.outputs.deployment_status || 'not_run' }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: build/
      - name: Explain skipped deployment
        id: explain_skipped
        if: env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == ''
        run: |
          echo "Staging deploy skipped. Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID to repository Actions secrets."
          echo "deployment_status=skipped_missing_secrets" >> "$GITHUB_OUTPUT"
      - name: Deploy staging site
        id: deploy_netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: |
          npx --yes netlify-cli deploy --dir=build --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --alias=staging --message="$GITHUB_SHA"
          echo "deployment_status=deployed" >> "$GITHUB_OUTPUT"

  notify-discord:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs:
      - codeql
      - lint
      - test
      - build
      - deploy-staging
    if: >-
      always() &&
      (
        needs.codeql.result == 'failure' ||
        needs.lint.result == 'failure' ||
        needs.test.result == 'failure' ||
        needs.build.result == 'failure' ||
        needs.deploy-staging.result == 'failure' ||
        (
          needs.codeql.result == 'success' &&
          needs.lint.result == 'success' &&
          needs.test.result == 'success' &&
          needs.build.result == 'success' &&
          (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
        )
      )
    steps:
      - name: Send pipeline notification
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
          DEPLOYMENT_STATUS: ${{ needs.deploy-staging.outputs.deployment_status || 'not_run' }}
          PIPELINE_RESULT: ${{ (needs.codeql.result == 'failure' || needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy-staging.result == 'failure') && 'failure' || 'success' }}
        run: |
          if [ "$PIPELINE_RESULT" = "failure" ]; then
            content="❌ GitHub Actions pipeline failed for ${GITHUB_REPOSITORY} on branch ${BRANCH_NAME}."
          elif [ "$DEPLOYMENT_STATUS" = "deployed" ]; then
            content="✅ Pipeline and Netlify staging deployment succeeded for ${GITHUB_REPOSITORY} on branch ${BRANCH_NAME}."
          elif [ "$DEPLOYMENT_STATUS" = "skipped_missing_secrets" ]; then
            content="✅ Checks and build succeeded for ${GITHUB_REPOSITORY} on branch ${BRANCH_NAME}; Netlify staging deployment was skipped because its secrets are missing."
          else
            content="✅ Pipeline succeeded for ${GITHUB_REPOSITORY} on branch ${BRANCH_NAME}; staging deployment was not run."
          fi
          payload=$(jq -n \
            --arg content "${content} Details: ${RUN_URL}" \
            '{content: $content, allowed_mentions: {parse: []}}')
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
