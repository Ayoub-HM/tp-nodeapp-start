default:
  image: node:20-alpine
  before_script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push

stages:
  - verify
  - build
  - deploy

lint:
  stage: verify
  script:
    - mkdir -p reports
    - npx eslint . --format gitlab --output-file reports/eslint-gitlab.json
  artifacts:
    when: always
    paths:
      - reports/eslint-gitlab.json
    expire_in: 1 week

unit_test:
  stage: verify
  script:
    - mkdir -p reports
    - npx vitest --run --reporter=default --reporter=junit --outputFile=reports/junit.xml
  artifacts:
    when: always
    paths:
      - reports/junit.xml
    reports:
      junit: reports/junit.xml
    expire_in: 1 week

build_app:
  stage: build
  script:
    - VITE_APP_VERSION=$CI_COMMIT_SHA VITE_ENVIRONMENT_NAME=staging npm run build
  artifacts:
    when: on_success
    paths:
      - build/
    expire_in: 1 week
  needs:
    - lint
    - unit_test

staging_deploy:
  stage: deploy
  image: node:20-alpine
  only:
    - main
  script:
    - |
      if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
        echo "Missing Netlify variables. Configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitLab CI/CD variables."
        exit 0
      fi
      npx netlify deploy --prod --dir=build --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="$CI_COMMIT_SHA"
  environment:
    name: staging
    url: https://staging.example.com
  needs:
    - build_app
